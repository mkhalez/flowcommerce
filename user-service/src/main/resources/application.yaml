spring:
  profiles:
    default: local
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true

server:
  port: 8080

cache:
  ttl-in-minutes: 10
  usersKey: user