spring:
  application:
    name: user-service
  config:
    import: optional:file:user-service/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 60000
      password: ${REDIS_PASSWORD}

cache:
  ttl-in-minutes: 10
  usersKey: user