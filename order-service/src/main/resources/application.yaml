spring:
  profiles:
    default: local
  application:
    name: order-service
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        default_batch_fetch_size: 50
        format_sql: true

server:
  port: 8082

resilience4j:
  circuitbreaker:
    instances:
      UserServiceCB:
        sliding-window-type: count_based
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        minimumNumberOfCalls: 5
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        recordException: org.springframework.web.client.ResourceAccessException
