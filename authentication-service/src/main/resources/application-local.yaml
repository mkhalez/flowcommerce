spring:
  config:
    import: optional:file:authentication-service/.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  kafka:
    bootstrap-servers:
      - localhost:29092
      - localhost:29093
      - localhost:29094
    producer.properties:
      acks: all
      batch.size: 1024
      linger.ms: 2000
      schema.registry.url: "http://localhost:8087"
      value.subject.name.strategy: "io.confluent.kafka.serializers.subject.TopicRecordNameStrategy"
      max.block.ms: 3000
      request.timeout.ms: 3000
      delivery.timeout.ms: 6000

registration:
  sender:
    scheduler.fixed.delay: 2000
    delay: 1000
    multiplier: 2
    max-attempts: 3
    number-events-to-process: 10
    kafka-cluster-timeoutSS: 6500
    enable.idempotence: true
    max.in.flight.requests.per.connection: 5
    base-attempt-second-adder: 1

security:
  initial:
    admin-password: ${ADMIN_PASSWORD}
    admin-username: ${ADMIN_USERNAME}
    active: true
    roles:
      - admin
      - user

client:
  user-service:
    base-url: http://localhost:8080/api/user/register
    read-timeout: 2000
    connection-timeout: 2000