apiVersion: batch/v1
kind: Job
metadata:
  name: user-liquibase
  namespace: microservices
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-db
          image: postgres:16
          command: ["sh", "-c", "until pg_isready -h user-postgres -p 5432 -U $POSTGRES_USER; do sleep 3; done"]
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-service-secret
                  key: USER_SERVICE_POSTGRES_USER
      containers:
        - name: liquibase
          image: mkhalez/user-migration:v1
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: user-service-secret, key: USER_SERVICE_POSTGRES_DB } }
            - name: LIQUIBASE_COMMAND_URL
              value: "jdbc:postgresql://user-postgres:5432/$(POSTGRES_DB)"
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom: { secretKeyRef: { name: user-service-secret, key: USER_SERVICE_POSTGRES_USER } }
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom: { secretKeyRef: { name: user-service-secret, key: USER_SERVICE_POSTGRES_PASSWORD } }
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: "changelog/changelog.xml"
          args: ["update"]
---
