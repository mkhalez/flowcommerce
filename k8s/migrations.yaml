apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-liquibase
  namespace: microservices
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-mongo
          image: mongo:7.0
          env:
            - name: MONGODB_USER
              valueFrom: { secretKeyRef: { name: payment-service-secret, key: MONGODB_USER } }
            - name: MONGODB_PASSWORD
              valueFrom: { secretKeyRef: { name: payment-service-secret, key: MONGODB_PASSWORD } }
          command:
            - sh
            - -c
            - |
              until mongosh --host payment-mongodb \
                  -u "$MONGODB_USER" -p "$MONGODB_PASSWORD" \
                  --authenticationDatabase admin --quiet \
                  --eval 'db.runCommand({ ping: 1 }).ok' | grep -q '^1$'; do
                echo "waiting for mongo replica set to be ready..."
                sleep 5
              done
      containers:
        - name: liquibase
          image: mkhalez/payment-migration:v4
          env:
            - name: MONGODB_DB
              valueFrom: { secretKeyRef: { name: payment-service-secret, key: MONGODB_DB } }
            - name: LIQUIBASE_COMMAND_URL
              value: "mongodb://payment-mongodb:27017/$(MONGODB_DB)?authSource=admin"
            - name: LIQUIBASE_COMMAND_USERNAME
              valueFrom: { secretKeyRef: { name: payment-service-secret, key: MONGODB_USER } }
            - name: LIQUIBASE_COMMAND_PASSWORD
              valueFrom: { secretKeyRef: { name: payment-service-secret, key: MONGODB_PASSWORD } }
            - name: LIQUIBASE_COMMAND_CHANGELOG_FILE
              value: "changelog/changelog.xml"
          args: ["--log-level=DEBUG", "update"]