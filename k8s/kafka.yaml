apiVersion: v1
kind: Service
metadata:
  name: kafka-broker
  namespace: microservices
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: kafka-broker
  ports:
    - name: internal
      port: 9091
    - name: external
      port: 29092
    - name: controller
      port: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-broker
  namespace: microservices
spec:
  serviceName: kafka-broker
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka-broker
  template:
    metadata:
      labels:
        app: kafka-broker
    spec:
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.7.8
          env:
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: CLUSTER_ID
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "INTERNAL://:9091,EXTERNAL://:29092,CONTROLLER://:9093"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "INTERNAL"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "2"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_OFFSET_TOPIC_REPLICATION_FACTOR
              value: "3"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "0@kafka-broker-0.kafka-broker.microservices.svc.cluster.local:9093,1@kafka-broker-1.kafka-broker.microservices.svc.cluster.local:9093,2@kafka-broker-2.kafka-broker.microservices.svc.cluster.local:9093"
          command:
            - bash
            - -c
            - |
              export KAFKA_NODE_ID=${HOSTNAME##*-}
              export KAFKA_ADVERTISED_LISTENERS="INTERNAL://${HOSTNAME}.kafka-broker.microservices.svc.cluster.local:9091,EXTERNAL://${HOSTNAME}.kafka-broker.microservices.svc.cluster.local:29092"
              exec /etc/confluent/docker/run
          ports:
            - containerPort: 9091
            - containerPort: 29092
            - containerPort: 9093
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9091
            initialDelaySeconds: 15
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi