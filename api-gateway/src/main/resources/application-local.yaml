spring:
  config:
    import: optional:file:user-service/.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8081/.well-known/jwks.json

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-refresh-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/refresh
              filters:
                - JwtClaimAuthorize=type,refresh

            - id: auth-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/auth/**

            - id: order-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/order/**
              filters:
                - JwtClaimAuthorize=type,access

            - id: user-route
              uri: http://localhost:8080
              predicates:
                - Path=/api/user/**
              filters:
                - JwtClaimAuthorize=type,access